<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Обновить вишлист</title>
    <style>
        :root { color-scheme: dark; }
        body {
            width: 300px;
            margin: 0;
            padding: 14px;
            background: #1b2838;
            color: #c7d5e0;
            font: 13px/1.45 system-ui, sans-serif;
        }
        h1 { margin: 0 0 10px; font-size: 14px; color: #fff; }
        button {
            width: 100%;
            padding: 9px;
            border: 0;
            border-radius: 3px;
            background: #4c6b22;
            color: #d2e885;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: #5c8a1f; }
        button:disabled { opacity: .5; cursor: default; }
        #status { margin-top: 10px; white-space: pre-line; }
        #status.err { color: #ff7b72; }
        #status.ok { color: #a4d007; }
        #folder { margin-top: 10px; color: #7a94a8; font-size: 12px; }
        a { color: #66c0f4; }
        #confirm { margin-top: 10px; display: none; }
        #confirm button { background: #8a3b2a; color: #ffd9d2; }
        #setup { margin-top: 10px; display: none; }
        #setup button { background: #33445a; color: #c7d5e0; }
    </style>
</head>
<body>
    <h1>Вишлист → games.json</h1>
    <button id="go">Обновить вишлист</button>
    <div id="status"></div>
    <div id="setup">
        <button id="open">Открыть настройки и выбрать папку</button>
    </div>
    <div id="confirm">
        <button id="force">Всё равно записать</button>
    </div>
    <div id="folder"></div>
    <script type="module" src="popup.js"></script>
</body>
</html>
